<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorpFinGuard - Giriş</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 { text-align: center; color: #667eea; margin-bottom: 10px; font-size: 2em; }
        p { text-align: center; color: #6c757d; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #2c3e50; font-weight: 500; margin-bottom: 8px; }
        input {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 15px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
        }
        button:hover { opacity: 0.9; }
        .demo-btn { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); }
        .info {
            background: #e7f1ff; padding: 15px; border-radius: 8px;
            margin-bottom: 20px; font-size: 14px;
        }
        .info strong { display: block; margin-bottom: 5px; color: #667eea; }
        .signup-link { text-align: center; margin-top: 15px; font-size: 14px; color: #6c757d; }
        .signup-link a { color: #667eea; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🛡️ CorpFinGuard</h1>
        <p>Giriş Yapın</p>

        <div class="info">
            <strong>Test Hesapları:</strong>
            E-posta: test@test.com<br>
            Şifre: test123
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" value="test@test.com" required>
            </div>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" value="test123" required>
            </div>
            <button type="submit">🚀 Giriş Yap</button>
        </form>

        <button class="demo-btn" onclick="goDemoMode()">🎭 Demo Modu (Kayıt Gerektirmez)</button>

        <div class="signup-link">
            Hesabınız yok mu? <a href="signup.html">Kayıt Olun</a>
        </div>
    </div>

    <script>
        var accounts = {
            'test@test.com': { password: 'test123', name: 'Test Kullanici', premium: true },
            'demo@corpfinguard.com': { password: 'demo123', name: 'Demo Kullanici', premium: true }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var account = accounts[email];

            if (!account) { alert('Bu e-posta kayitli degil!'); return; }
            if (account.password !== password) { alert('Sifre yanlis!'); return; }

            var session = {
                email: email,
                name: account.name,
                isPremium: account.premium,
                isDemo: false,
                loginTime: new Date().toISOString()
            };
            sessionStorage.setItem('corpfinguard_session', JSON.stringify(session));
            alert('Giris basarili! Dashboard aciliyor...');
            window.location.href = 'dashboard_final.html';
        });

        function goDemoMode() {
            var demoSession = {
                email: 'demo@demo.com',
                name: 'Demo Kullanici',
                isPremium: false,
                isDemo: true,
                loginTime: new Date().toISOString()
            };
            sessionStorage.setItem('corpfinguard_session', JSON.stringify(demoSession));
            alert('Demo moduna hos geldiniz!');
            window.location.href = 'dashboard_final.html';
        }

        window.addEventListener('DOMContentLoaded', function() {
            var session = sessionStorage.getItem('corpfinguard_session') ||
                          localStorage.getItem('corpfinguard_session');
            if (session) {
                window.location.href = 'dashboard_final.html';
            }
        });
    </script>
</body>
</html>
